name: Release binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish under"
        required: false
        default: ""

permissions:
  contents: write 

jobs:
  build:
    name: alloysh + alloyctl (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-musl
            extra-targets: x86_64-unknown-linux-musl
            rustflags: "-C target-feature=+crt-static"
            tui-release: alloysh-linux-x86_64
            cli-release: alloyctl-linux-x86_64
            go-os: linux
            go-arch: amd64
          - name: macos-universal
            os: macos-latest
            rust-target: aarch64-apple-darwin
            extra-targets: x86_64-apple-darwin,aarch64-apple-darwin
            rustflags: ""
            tui-release: alloysh-macos-universal
            cli-release: alloyctl-macos-universal
            go-os: macos
            go-arch: ""
            go-extra-archs: "amd64 arm64"
          - name: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            extra-targets: x86_64-pc-windows-msvc
            rustflags: ""
            tui-release: alloysh-windows-x86_64.exe
            cli-release: alloyctl-windows-x86_64.exe
            go-os: windows
            go-arch: amd64

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # ring (via rustls -> reqwest/oauth2) compiles C/asm code with the `cc`
      # crate. for the musl target it needs musl-gcc, which the musl-tools
      # package installs below; this env var points cc-rs at it directly.
      CC_x86_64_unknown_linux_musl: musl-gcc

    steps:
      - uses: actions/checkout@v7

      # CARGO_PKG_VERSION is baked in at compile time (User-Agent, startup
      # log), so rewrite it from the release tag before building — otherwise
      # every binary reports 1.0.0 no matter the tag. run-local only: the
      # repo's Cargo.toml is left untouched.
      - name: Sync version from release tag
        if: github.event.inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          # cargo needs full semver: v3.78 -> 3.78.0, v3 -> 3.0.0
          case "$VERSION" in
            *.*.*) ;;
            *.*) VERSION="${VERSION}.0" ;;
            *) VERSION="${VERSION}.0.0" ;;
          esac
          # portable rewrite: BSD sed on macOS rejects `sed -i`
          sed "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          echo "TUI version set to $VERSION"

      # ---- TUI (Rust) build ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra-targets }}

      # build.rs compiles java/AlloyShim.java, so javac + jar must be on PATH
      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install musl C toolchain and UPX (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools upx-ucl

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx -y

      - name: Build TUI (${{ matrix.rust-target }})
        if: runner.os != 'macOS' # macOS builds both arches in its own step
        run: cargo build --release --target ${{ matrix.rust-target }}
        env:
          ALLOY_CURSEFORGE_API_KEY: ${{ secrets.ALLOY_CURSEFORGE_API_KEY }}

      # lipo needs both slices, so the generic single-target build step above
      # is skipped on macOS and both arches are built here instead.
      - name: Build TUI (macOS, both architectures)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
        env:
          ALLOY_CURSEFORGE_API_KEY: ${{ secrets.ALLOY_CURSEFORGE_API_KEY }}

      - name: Package TUI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp "target/${{ matrix.rust-target }}/release/alloysh" "${{ matrix.tui-release }}"
          strip "${{ matrix.tui-release }}"
          upx -9 "${{ matrix.tui-release }}"
          sha256sum "${{ matrix.tui-release }}" > "${{ matrix.tui-release }}.sha256"

      - name: Package TUI (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lipo -create -output "${{ matrix.tui-release }}" \
            target/x86_64-apple-darwin/release/alloysh \
            target/aarch64-apple-darwin/release/alloysh
          strip "${{ matrix.tui-release }}"
          upx -9 "${{ matrix.tui-release }}" || echo "Warning: UPX compression failed on macOS, binary not compressed"
          shasum -a 256 "${{ matrix.tui-release }}" > "${{ matrix.tui-release }}.sha256"

      - name: Package TUI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.rust-target }}/release/alloysh.exe" "${{ matrix.tui-release }}"
          upx -9 "${{ matrix.tui-release }}" || echo "Warning: UPX compression failed on Windows, binary not compressed"
          sha256sum "${{ matrix.tui-release }}" > "${{ matrix.tui-release }}.sha256"

      # ---- CLI (Go) build ----
      # The CLI lives on the `cli` branch (Go source), so check it out into a
      # separate directory and build from there.
      - name: Checkout CLI branch
        uses: actions/checkout@v7
        with:
          ref: cli
          path: alloy-cli-src

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd alloy-cli-src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../${{ matrix.cli-release }}" ./cmd/alloyctl
          upx -9 "../${{ matrix.cli-release }}"

      - name: Build CLI (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd alloy-cli-src
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../${{ matrix.cli-release }}.x86_64" ./cmd/alloyctl
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "../${{ matrix.cli-release }}.arm64" ./cmd/alloyctl
          lipo -create -output "../${{ matrix.cli-release }}" "../${{ matrix.cli-release }}.x86_64" "../${{ matrix.cli-release }}.arm64"
          rm "../${{ matrix.cli-release }}.x86_64" "../${{ matrix.cli-release }}.arm64"
          upx -9 "../${{ matrix.cli-release }}" || echo "Warning: UPX compression failed on macOS, binary not compressed"

      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd alloy-cli-src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../${{ matrix.cli-release }}" ./cmd/alloyctl
          upx -9 "../${{ matrix.cli-release }}" || echo "Warning: UPX compression failed on Windows, binary not compressed"

      - name: Generate CLI checksums (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sha256sum "${{ matrix.cli-release }}" > "${{ matrix.cli-release }}.sha256"

      - name: Generate CLI checksums (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sha256sum "${{ matrix.cli-release }}" > "${{ matrix.cli-release }}.sha256"

      # ---- Upload artifacts ----
      # both TUI and CLI artifacts are uploaded so manual runs still leave
      # downloadable files
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.tui-release }}
            ${{ matrix.tui-release }}.sha256
            ${{ matrix.cli-release }}
            ${{ matrix.cli-release }}.sha256

      # publishes under the version given in the manual run. the tag is
      # auto-created at the default branch if it doesn't exist yet. skipped
      # when no version was provided (artifacts are still downloadable above).
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.event.inputs.version != ''
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            ${{ matrix.tui-release }}
            ${{ matrix.tui-release }}.sha256
            ${{ matrix.cli-release }}
            ${{ matrix.cli-release }}.sha256
          fail_on_unmatched_files: true
